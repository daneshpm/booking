version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One pull request per ecosystem keeps routine patch noise low without
      # hiding a major bump that needs real review.
      minor-and-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: monthly
