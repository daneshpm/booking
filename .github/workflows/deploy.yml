name: Deploy

# Runs only after CI has finished on main, and only builds if CI passed.
# Pushing straight to main never bypasses the test suite: a red CI run
# blocks this from ever pushing an image.
#
# This workflow only builds and publishes images to GHCR. It cannot reach
# into the production host directly: that host lives on a private LAN
# address, and GitHub's hosted runners have no route to it (no VPN, no port
# forward, and a self-hosted runner isn't an option without repo admin
# rights). Instead, a systemd timer running ON the host itself
# (deploy/deploy-poll.sh, installed once by hand) polls GHCR every couple of
# minutes and pulls + restarts whatever changed. See deploy/README.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # The web runtime image: only the pruned Next.js standalone output.
          # NEXT_PUBLIC_APP_URL is a build arg, not a runtime env var: Next.js
          # inlines NEXT_PUBLIC_* values into the compiled output during
          # `next build` itself, so setting it only on the running container
          # (docker-compose environment, an updated .env) has no effect —
          # this is the one place it actually takes hold. Not a secret (it's
          # the app's own public URL), so it's fine to hardcode here.
          - name: web
            context: .
            dockerfile: apps/web/Dockerfile
            target: runner
            build_args: NEXT_PUBLIC_APP_URL=https://booking.futureacad.ae
          # Built from the same Dockerfile's intermediate stage, which still
          # carries the full node_modules and Prisma CLI the runner image
          # deliberately drops.
          - name: migrate
            context: .
            dockerfile: apps/web/Dockerfile
            target: builder
            build_args: NEXT_PUBLIC_APP_URL=https://booking.futureacad.ae
          - name: worker
            context: .
            dockerfile: apps/worker/Dockerfile
            target: runner
            build_args: ''
          - name: api
            context: ./apps/api
            dockerfile: apps/api/Dockerfile
            target: ''
            build_args: ''
    steps:
      - name: Checkout the commit CI just tested
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Compute image prefix
        id: vars
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_prefix=ghcr.io/${owner}/rooman-bookings" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: |
            ${{ steps.vars.outputs.image_prefix }}-${{ matrix.name }}:latest
            ${{ steps.vars.outputs.image_prefix }}-${{ matrix.name }}:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
