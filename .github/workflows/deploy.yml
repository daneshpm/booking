name: Deploy

# Runs only after CI has finished on main, and only deploys if CI passed.
# Pushing straight to main never bypasses the test suite: a red CI run
# blocks the deploy below from ever starting.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # The web runtime image: only the pruned Next.js standalone output.
          - name: web
            context: .
            dockerfile: apps/web/Dockerfile
            target: runner
          # Built from the same Dockerfile's intermediate stage, which still
          # carries the full node_modules and Prisma CLI the runner image
          # deliberately drops.
          - name: migrate
            context: .
            dockerfile: apps/web/Dockerfile
            target: builder
          - name: worker
            context: .
            dockerfile: apps/worker/Dockerfile
            target: runner
          - name: api
            context: ./apps/api
            dockerfile: apps/api/Dockerfile
            target: ''
    steps:
      - name: Checkout the commit CI just tested
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Compute image prefix
        id: vars
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_prefix=ghcr.io/${owner}/rooman-bookings" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ steps.vars.outputs.image_prefix }}-${{ matrix.name }}:latest
            ${{ steps.vars.outputs.image_prefix }}-${{ matrix.name }}:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-push
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/rooman-bookings
            docker compose -f docker-compose.prod.yml pull
            # Not `up -d`: that only starts the container and returns
            # immediately. This attaches until migrate exits and fails the
            # step (so the deploy stops here) if migrations fail.
            docker compose -f docker-compose.prod.yml up migrate --no-build --exit-code-from migrate
            docker compose -f docker-compose.prod.yml up -d --remove-orphans --no-build
            # This container's disk is small; without pruning, a few days of
            # daily deploys is enough to fill it and fail the next one.
            docker image prune -f
