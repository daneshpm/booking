name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a pull request cancels the run still going for the old commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Match the runtimes the production images ship, so CI cannot pass on a
  # version that is never deployed.
  NODE_VERSION: '26'
  PYTHON_VERSION: '3.14'

jobs:
  # ---------------------------------------------------------------
  # Type safety, unit tests and a production build.
  # ---------------------------------------------------------------
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck every package
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npx vitest run --coverage --reporter=dot

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: coverage/
          retention-days: 7

      - name: Production build
        # A build-time DATABASE_URL is required for Prisma to initialise. No
        # queries run during the build, so it never has to be reachable.
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/placeholder
          NODE_ENV: production
        run: npm run build

  # ---------------------------------------------------------------
  # Integration suites against a real PostgreSQL.
  # ---------------------------------------------------------------
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bookings_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bookings_test?schema=public
      # Exercises the shared rate limiter rather than the per-process
      # fallback, which is what runs behind a load balancer.
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply migrations
        # Uses the committed migrations rather than db push, so the migration
        # files themselves are exercised on every run.
        run: npm run db:migrate:deploy

      - name: Verify the overlap constraint exists
        # psql rejects Prisma's ?schema= query parameter, so it is stripped here.
        run: |
          PSQL_URL="${DATABASE_URL%%\?*}"
          psql "$PSQL_URL" -tAc \
            "SELECT conname FROM pg_constraint WHERE conname = 'bookings_no_staff_overlap';" \
            | grep -q bookings_no_staff_overlap
        env:
          PGPASSWORD: postgres

      - name: Integration tests
        run: npx vitest run --config vitest.integration.config.mts --reporter=verbose

      - name: Workflow runner completes a sweep against an empty database
        # Proves the worker starts, connects and exits cleanly. Without a
        # smoke test a broken entry point would only surface when reminders
        # silently stopped arriving.
        run: npm run workflows:run

      - name: Seed refuses to run without credentials
        # The seed must never invent an administrator password.
        run: |
          if npm run db:seed > seed.log 2>&1; then
            echo "Seed should have failed with no ADMIN_EMAIL or ADMIN_PASSWORD set."
            cat seed.log
            exit 1
          fi
          grep -q "ADMIN_EMAIL is required" seed.log

      - name: Seed rejects a weak administrator password
        run: |
          if ADMIN_EMAIL=ci@example.com ADMIN_PASSWORD=short npm run db:seed > weak.log 2>&1; then
            echo "Seed should have rejected a weak password."
            cat weak.log
            exit 1
          fi
          grep -q "not strong enough" weak.log

      - name: Seed succeeds with valid credentials and is idempotent
        env:
          ADMIN_EMAIL: ci@example.com
          ADMIN_PASSWORD: C1RunnerPassphrase
          WORKSPACE_NAME: CI Workspace
        run: |
          npm run db:seed
          npm run db:seed

  # ---------------------------------------------------------------
  # Schema and migrations must not drift apart.
  # ---------------------------------------------------------------
  migration-drift:
    name: Migration drift check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: drift_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drift_check?schema=public
      # Prisma drops and recreates the shadow database, so it must never be
      # the one being compared against.
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drift_shadow?schema=public

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Create the shadow database
        env:
          PGPASSWORD: postgres
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE drift_shadow;"

      - name: Install dependencies
        run: npm ci

      - name: Fail if schema.prisma has changes no migration covers
        # Without this, a schema edit merged without its migration would only
        # surface as a runtime error after deployment.
        run: |
          npx prisma migrate diff \
            --config packages/database/prisma.config.ts \
            --from-migrations packages/database/prisma/migrations \
            --to-schema packages/database/prisma/schema.prisma \
            --exit-code \
          && echo "Schema and migrations agree." \
          || { echo "::error::schema.prisma has changes with no migration. Run: npm run db:migrate"; exit 1; }

  # ---------------------------------------------------------------
  # FastAPI service.
  # ---------------------------------------------------------------
  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/api_test?schema=public

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      # Prisma owns the schema, so migrations are applied with the Node
      # toolchain before the Python suite runs against those tables.
      - name: Apply migrations
        run: |
          npm ci
          npm run db:generate
          npm run db:migrate:deploy

      - name: Install Python dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyflakes

      - name: Lint
        working-directory: apps/api
        run: python -m pyflakes .

      - name: Tests
        working-directory: apps/api
        run: python -m pytest tests/ -q

  # ---------------------------------------------------------------
  # Dependency vulnerabilities.
  # ---------------------------------------------------------------
  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        # Fails on any unreviewed high or critical advisory, and on an
        # allowlist entry that is past its review date. See
        # .github/audit-allowlist.json for what is accepted and why.
        run: npm run audit

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Audit Python dependencies
        # apps/api has no equivalent allowlist file yet, so this fails on any
        # known vulnerability rather than only high/critical; tighten to match
        # the npm audit's severity threshold if noise becomes a problem.
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r apps/api/requirements.txt

  # ---------------------------------------------------------------
  # Single required status check for branch protection.
  # ---------------------------------------------------------------
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [quality, integration, migration-drift, api, security]
    if: always()
    steps:
      - name: Fail if any job did not succeed
        run: |
          echo "quality:        ${{ needs.quality.result }}"
          echo "integration:    ${{ needs.integration.result }}"
          echo "migration-drift:${{ needs.migration-drift.result }}"
          echo "api:            ${{ needs.api.result }}"
          echo "security:       ${{ needs.security.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
